services:
  - type: web
    name: bdc-ai-business-assistant
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: DEMO_MODE
        value: "true"
      - key: AI_PROVIDER
        value: mock
      - key: BUSINESS_DATA_PROVIDER
        value: mock
      - key: WEB_SEARCH_PROVIDER
        value: wikipedia
      - key: DEMO_USERNAME
        value: demo
      - key: DEMO_PASSWORD
        generateValue: true
