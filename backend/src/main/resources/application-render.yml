spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:bdc;MODE=MySQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
server:
  address: 0.0.0.0
  port: ${PORT:10000}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
